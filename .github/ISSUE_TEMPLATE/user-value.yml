name: 사용자 가치
description: 사용자가 얻게 될 하나의 결과를 제안합니다.
labels:
  - "type:user-value"
body:
  - type: markdown
    attributes:
      value: |
        제목에는 접두사 없이 사용자가 얻게 될 결과를 작성합니다.
        Phase에 포함해 진행할 Issue라면 생성 후 해당 Milestone을 지정합니다.

  - type: textarea
    id: problem-goal
    attributes:
      label: 문제와 목표
      description: 현재 불편하거나 불가능한 상황과 완료 후 사용자가 얻게 될 결과를 작성합니다.
      placeholder: |
        현재 사용자는 ...할 수 없다.
        완료 후에는 ...할 수 있다.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 인수 조건
      description: 구현 방법이 아니라 외부에서 확인할 수 있는 완료 조건을 작성합니다.
      placeholder: |
        - [ ] 사용자가 확인할 수 있는 정상 결과
        - [ ] 주요 경계 또는 실패 상황
    validations:
      required: true

  - type: textarea
    id: excluded-scope
    attributes:
      label: 제외 범위
      description: 이번 Issue에서 다루지 않을 내용을 작성합니다. 없으면 `없음`이라고 작성합니다.
      placeholder: 없음
    validations:
      required: true

  - type: textarea
    id: work-plan
    attributes:
      label: Work 계획
      description: 각 Work의 논리적 변경 목적과 검증 방법을 함께 작성합니다.
      placeholder: |
        - [ ] w1: 논리적 변경 목적 — 검증 방법
        - [ ] w2: 논리적 변경 목적 — 검증 방법
    validations:
      required: true

  - type: textarea
    id: open-decisions
    attributes:
      label: 미결정 사항
      description: 구현 전에 결정해야 할 API 계약, 사용자 동작, 데이터 또는 보안 관련 선택을 작성합니다. 없으면 `없음`이라고 작성합니다.
      placeholder: 없음
    validations:
      required: true
