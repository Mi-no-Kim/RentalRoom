name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      backend: ${{ steps.scope.outputs.backend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check changed files
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          frontend=$(bash scripts/ci/should-check.sh frontend "$GITHUB_EVENT_NAME" "$BASE_SHA" "$HEAD_SHA")
          backend=$(bash scripts/ci/should-check.sh backend "$GITHUB_EVENT_NAME" "$BASE_SHA" "$HEAD_SHA")
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Check Prettier formatting
        run: npm run format:prettier:check

  frontend:
    name: Frontend
    needs: formatting
    if: needs.formatting.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint --workspace frontend
      - name: Test frontend
        run: npm run test --workspace frontend
      - name: Build frontend
        run: npm run build --workspace frontend

  backend:
    name: Backend
    needs: formatting
    if: needs.formatting.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Check backend
        working-directory: backend
        run: ./gradlew check --no-daemon
