name: rental-room

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${DB_NAME:-rental_room}
      POSTGRES_USER: ${DB_USERNAME:-rental_room}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rental_room}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
